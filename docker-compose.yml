services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      # Mount the user's AWS credentials read-only
      - ~/.aws:/root/.aws:ro
    environment:
      - BEDROCK_REGION=us-east-1
      - MODEL_ID=us.amazon.nova-lite-v1:0
      - AWS_PROFILE=default
  
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:3000
    depends_on:
      - backend