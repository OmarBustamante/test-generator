AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  test-generator backend
  API para generar examenes de opcion multiple a partir de documentos

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.14
    Architectures:
      - x86_64
    Environment:
      Variables:
        BEDROCK_REGION: us-east-1
        MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
  Api:
    Cors:
      AllowMethods: "'POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:
  GenerateExamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Policies:
        - AmazonBedrockFullAccess
      Events:
        GenerateExam:
          Type: Api
          Properties:
            Path: /generate
            Method: post

Outputs:
  GenerateExamApi:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/generate"
  GenerateExamFunction:
    Description: Lambda Function ARN
    Value: !GetAtt GenerateExamFunction.Arn
